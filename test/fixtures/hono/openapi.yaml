openapi: 3.0.3
info:
  title: Shop API on Hono
  version: 1.0.0
paths:
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          description: ok
  /api/users:
    get:
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: ok
    post:
      operationId: createUser
      responses:
        '201':
          description: created
  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      responses:
        '200':
          description: ok
    patch:
      operationId: updateUser
      responses:
        '200':
          description: ok
    delete:
      operationId: deleteUser
      responses:
        '204':
          description: deleted
  /api/users/{id}/avatar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAvatar
      responses:
        '200':
          description: ok
  /api/orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: ok
  /api/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: replaceOrder
      responses:
        '200':
          description: ok
  /api/orders/{orderId}/items/{path}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
      - name: path
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listItems
      responses:
        '200':
          description: ok
  /api/admin/stats:
    get:
      operationId: adminStats
      responses:
        '200':
          description: ok
  /api/v2/reports/{day}:
    parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
    get:
      operationId: dailyReport
      responses:
        '200':
          description: ok
  /api/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceItem
      responses:
        '204':
          description: replaced
    delete:
      operationId: deleteItem
      responses:
        '204':
          description: deleted
