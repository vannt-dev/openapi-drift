name: OpenAPI drift
description: Compares an OpenAPI document with the routes in your NestJS, Express, Fastify or Spring code and fails the job on drift.
author: Van Nguyen
branding:
  icon: git-compare
  color: blue

inputs:
  spec:
    description: The OpenAPI 3 document (YAML or JSON).
    required: true
  source:
    description: The source tree of the backend.
    required: false
    default: .
  framework:
    description: nestjs, express, fastify, spring or auto.
    required: false
    default: auto
  prefix:
    description: >-
      A prefix the code adds to every route and the source does not show. Not needed for a NestJS global prefix
      or URI versioning, which are read from the code; given, it replaces what the code says.
    required: false
    default: ''
  fail-on:
    description: 'any: fail on drift in either direction; spec: only routes the document lacks; code: only operations the code lacks; none: never fail.'
    required: false
    default: any
  ignore:
    description: "Drift to leave out, one pattern a line: /health, 'GET /internal/**' (* is one segment, ** any number)."
    required: false
    default: ''
  ignore-file:
    description: A file of ignore patterns, one a line, # starts a comment.
    required: false
    default: ''
  baseline:
    description: A baseline file (written by `openapi-drift check --baseline <file> --update-baseline`); the drift it lists is reported and does not fail the job.
    required: false
    default: ''
  strict:
    description: Set to 'true' for query parameters and status codes that differ to fail the job; they are reported either way.
    required: false
    default: 'false'
  report:
    description: Where to write the Markdown report; it is also added to the job summary.
    required: false
    default: openapi-drift.md
  annotations:
    description: >-
      Set to 'false' to leave out the annotations: each drift as an error, warning or notice on its line
      (the route in the code, the operation in the document), shown on the pull request's changed files.
    required: false
    default: 'true'
  sarif:
    description: >-
      Where to write a SARIF 2.1.0 log of the drift, for github/codeql-action/upload-sarif to show it under
      code scanning. Empty (the default) writes none.
    required: false
    default: ''

outputs:
  drifts:
    description: The number of drifts found (routes missing in the document plus operations missing in the code).
    value: ${{ steps.check.outputs.drifts }}
  report:
    description: The path of the Markdown report.
    value: ${{ inputs.report }}
  sarif:
    description: The path of the SARIF log, when the sarif input asks for one.
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install openapi-drift
      shell: bash
      # a full install: the build needs TypeScript, a dev dependency
      run: npm ci --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH" && npm run build --prefix "$GITHUB_ACTION_PATH"
      env:
        npm_config_update_notifier: 'false'
    - name: Check
      id: check
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        SOURCE: ${{ inputs.source }}
        FRAMEWORK: ${{ inputs.framework }}
        PREFIX: ${{ inputs.prefix }}
        FAIL_ON: ${{ inputs.fail-on }}
        IGNORE: ${{ inputs.ignore }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        BASELINE: ${{ inputs.baseline }}
        STRICT: ${{ inputs.strict }}
        REPORT: ${{ inputs.report }}
        ANNOTATIONS: ${{ inputs.annotations }}
        SARIF: ${{ inputs.sarif }}
      run: |
        more=()
        while IFS= read -r pattern; do
          if [ -n "${pattern//[[:space:]]/}" ]; then more+=(--ignore "$pattern"); fi
        done <<< "$IGNORE"
        if [ -n "$IGNORE_FILE" ]; then more+=(--ignore-file "$IGNORE_FILE"); fi
        if [ -n "$BASELINE" ]; then more+=(--baseline "$BASELINE"); fi
        if [ "$STRICT" = "true" ]; then more+=(--strict); fi
        drift=(node "$GITHUB_ACTION_PATH/bin/openapi-drift.js" check --spec "$SPEC" --source "$SOURCE" --framework "$FRAMEWORK"
          --prefix "$PREFIX" --fail-on "$FAIL_ON" "${more[@]}")
        set +e
        "${drift[@]}" --format markdown --output "$REPORT"
        status=$?
        set -e
        # the same comparison in other forms; their notes are on stderr once already, the exit code is the first run's
        if [ "$status" -le 1 ]; then
          if [ "$ANNOTATIONS" = "true" ]; then "${drift[@]}" --format github 2>/dev/null || true; fi
          if [ -n "$SARIF" ]; then
            "${drift[@]}" --format sarif --output "$SARIF" >/dev/null 2>&1 || true
            echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
          fi
        fi
        if [ -f "$REPORT" ]; then
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          drifts=$(head -1 "$REPORT" | grep -oE '[0-9]+ drift' | grep -oE '[0-9]+' || echo 0)
          echo "drifts=$drifts" >> "$GITHUB_OUTPUT"
        fi
        exit $status
